<script>
{
// ======================= 1. CONSTANTS =======================
const MASTERS_PHASES=['1. Literature Review','2. Research Proposal','3. Experiments & Build','4. Paper / Thesis Draft','5. Final Defense'];
const PHD_PHASES=['1. Coursework & Qualifying Exam','2. Systematic Lit Review','3. Proposal & Candidacy','4. Multi-Study Research','5. Publications & Dissertation','6. Pre-Defense & Final Viva'];
const MS_STATUS=['Not Started','In Progress','Needs Review','Behind Schedule','Completed'];
const KANBAN=['Backlog','In Progress','Needs Review','Done'];
const OUTCOMES=['Baseline','Improved','Failed','Final'];
const RELEVANCE=['High','Medium','Low'];
const PUB_STATUS=['Idea','Drafting','Supervisor Review','Submitted','Under Review','Revision','Accepted','Published'];
const REVIEW_TYPES=['Qualifying Exam','Candidacy Defense','Ethics / IRB','Annual Progress Review','Committee Meeting'];
const REVIEW_OUT=['Passed','Approved','Conditional','Pending','Failed'];
const FILE_CATS=['Research Paper','Funding Plan','Thesis / Manuscript Draft','Progress Report','Data / Figures','Other'];
const COLLS=['students','milestones','logs','literature','experiments','publications','reviews','files','comments'];
const ROLE_LABEL={admin:'Administrator',supervisor:'Supervisor',reviewer:'Reviewer (professor)',student:'Student'};
const TABS=[['roadmap','Roadmap','map'],['logs','Meeting Logs','notebook-pen'],['experiments','Experiments','flask-conical'],['literature','Literature','book-open'],['publications','Publications','file-text'],['reviews','Reviews & Exams','clipboard-check'],['files','Files','folder'],['feedback','Feedback','message-square']];

// ======================= 2. STATE & SERVER API =======================
const uid=(p='id')=>`${p}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;
const todayISO=()=>new Date().toISOString().slice(0,10);
function emptyData(){const d={people:[]};COLLS.forEach(c=>d[c]=[]);return d}
const state={
  me:null,aiEnabled:false,maxUploadMb:25,booted:false,
  data:emptyData(),view:'overview',sid:null,tab:'roadmap',degree:'All',expView:'kanban',
  litSearch:'',litRel:'All',sidebarOpen:false,aiBrief:null,aiStudent:{},dragId:null,busy:false,users:null
};
try{const u=JSON.parse(localStorage.getItem('researchhub_ui')||'null');if(u)Object.assign(state,{view:u.view||'overview',sid:u.sid||null,tab:u.tab||'roadmap',degree:u.degree||'All',expView:u.expView||'kanban'})}catch{}
function saveUI(){try{localStorage.setItem('researchhub_ui',JSON.stringify({view:state.view,sid:state.sid,tab:state.tab,degree:state.degree,expView:state.expView}))}catch{}}

async function api(method,url,body,isForm){
  const opt={method,credentials:'same-origin',headers:{}};
  if(body!==undefined){if(isForm)opt.body=body;else{opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}}
  const r=await fetch(url,opt);
  let j=null;try{j=await r.json()}catch{}
  if(r.status===401&&!url.startsWith('/api/auth/login')){state.me=null;renderAll();throw new Error('Please sign in again')}
  if(!r.ok)throw new Error((j&&j.error)||`Request failed (${r.status})`);
  return j;
}
async function reload(){
  const d=await api('GET','/api/data');
  const nd=emptyData();Object.keys(nd).forEach(k=>{if(Array.isArray(d[k]))nd[k]=d[k]});state.data=nd;
  if(state.me.role==='student'){state.view='student';state.sid=state.me.studentId}
  if(state.sid&&!state.data.students.some(s=>s.id===state.sid)){state.sid=null;state.view=state.view==='users'?'users':'overview'}
  renderAll();
}
// Run a change on the server, then refresh everything
async function mutate(fn,okMsg){
  if(state.busy)return;state.busy=true;renderBusy();
  try{await fn();await reload();if(okMsg)toast(okMsg,'success')}
  catch(e){toast(e.message||'Something went wrong','error');try{await reload()}catch{}}
  finally{state.busy=false;renderBusy()}
}
function renderBusy(){const el=document.getElementById('busy-dot');if(el)el.className=`h-2 w-2 rounded-full ${state.busy?'bg-amber-400 animate-pulse':'bg-emerald-500'}`}
const D=()=>state.data;
const findStu=id=>D().students.find(s=>s.id===id)||null;
const role=()=>state.me?.role;
const isAdmin=()=>role()==='admin';
const isSup=()=>role()==='admin'||role()==='supervisor';
function canEdit(coll){const r=role();if(r==='admin'||r==='supervisor')return true;if(r==='reviewer')return coll==='comments';if(r==='student')return coll!=='reviews'&&coll!=='students';return false}
const personName=id=>(D().people.find(p=>p.id===id)||{}).name||'';

// ======================= 3. UTILITIES =======================
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function safeUrl(u){const s=String(u||'').trim();if(!s)return '';const v=/^https?:\/\//i.test(s)?s:'https://'+s;return /^https:\/\//i.test(v)||/^http:\/\//i.test(v)?v:''}
function link(u,label){const v=safeUrl(u);return v?`<a href="${esc(v)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-indigo-700 hover:underline"><i data-lucide="external-link" class="h-3 w-3"></i>${esc(label)}</a>`:''}
function cleanDoi(raw){let s=String(raw||'').trim();s=s.replace(/^https?:\/\/(dx\.)?doi\.org\//i,'').replace(/^doi:\s*/i,'').trim();return /^10\.\d{4,9}\/\S+$/i.test(s)?s:''}
function fmt(iso){if(!iso)return 'TBD';const d=new Date(iso+(String(iso).length===10?'T00:00:00':''));return isNaN(d)?esc(iso):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function daysUntil(iso){if(!iso)return null;const d=new Date(iso+'T00:00:00');if(isNaN(d))return null;return Math.round((d-new Date(todayISO()+'T00:00:00'))/864e5)}
const phasesFor=t=>t==='PhD'?PHD_PHASES:MASTERS_PHASES;
function badge(st){
  const g=['Completed','Done','Published','Accepted','Improved','Passed','Approved'],b=['In Progress','Drafting','Submitted','Under Review','Final'],a=['Needs Review','Supervisor Review','Revision','Pending','Conditional'],r=['Behind Schedule','Failed','Overdue'];
  const c=g.includes(st)?'bg-emerald-50 text-emerald-700 border-emerald-200':b.includes(st)?'bg-indigo-50 text-indigo-700 border-indigo-200':a.includes(st)?'bg-amber-50 text-amber-800 border-amber-200':r.includes(st)?'bg-rose-50 text-rose-700 border-rose-200':'bg-slate-100 text-slate-600 border-slate-200';
  return `<span class="inline-flex items-center whitespace-nowrap rounded-full border px-2 py-0.5 text-[11px] font-semibold ${c}">${esc(st||'—')}</span>`}
function bar(p,cls='bg-indigo-600'){const v=Math.max(0,Math.min(100,Number(p)||0));return `<div class="h-1.5 w-full rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full ${v===100?'bg-emerald-500':cls}" style="width:${v}%"></div></div>`}
function toast(msg,type='info'){const c=document.getElementById('toasts');const col={success:'bg-emerald-700',warning:'bg-amber-600',error:'bg-rose-700',info:'bg-slate-900'};const el=document.createElement('div');el.className=`rounded-xl px-4 py-2.5 text-xs font-semibold text-white shadow-lg transition-opacity ${col[type]||col.info}`;el.textContent=msg;c.appendChild(el);setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300)},3400)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copied to clipboard','success')}catch{try{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('Copied to clipboard','success')}catch{toast('Copy blocked — select the text and copy it manually.','warning')}}}
function icons(){try{window.lucide&&window.lucide.createIcons()}catch{}}
const btn=(act,label,icon,cls='border border-slate-200 bg-white text-slate-700 hover:bg-slate-50',extra='')=>`<button data-act="${act}" ${extra} class="inline-flex min-h-[36px] items-center gap-1.5 rounded-xl px-3 py-2 text-xs font-semibold transition-colors ${cls}">${icon?`<i data-lucide="${icon}" class="h-3.5 w-3.5"></i>`:''}<span>${label}</span></button>`;
const iconBtn=(act,icon,attrs,title)=>`<button data-act="${act}" ${attrs} title="${title}" aria-label="${title}" class="rounded-lg p-1.5 text-slate-400 hover:bg-slate-100 hover:text-slate-700"><i data-lucide="${icon}" class="h-3.5 w-3.5"></i></button>`;

// ======================= 4. DERIVED DATA =======================
function bundle(id){
  const d=D(),student=findStu(id);
  const by=c=>d[c].filter(x=>x.studentId===id);
  const milestones=by('milestones'),logs=by('logs').sort((a,b)=>(b.date||'').localeCompare(a.date||'')),literature=by('literature'),experiments=by('experiments'),publications=by('publications'),reviews=by('reviews').sort((a,b)=>(b.date||'').localeCompare(a.date||'')),files=by('files').sort((a,b)=>(b.uploadedAt||'').localeCompare(a.uploadedAt||'')),comments=by('comments');
  const avg=milestones.length?Math.round(milestones.reduce((s,m)=>s+(Number(m.progress)||0),0)/milestones.length):0;
  const overdue=milestones.filter(m=>m.status!=='Completed'&&daysUntil(m.endDate)!==null&&daysUntil(m.endDate)<0);
  const active=milestones.find(m=>m.status==='In Progress'||m.status==='Behind Schedule')||milestones.find(m=>m.status!=='Completed')||milestones[0];
  return {student,milestones,logs,literature,experiments,publications,reviews,files,comments,avg,
    done:milestones.filter(m=>m.status==='Completed').length,
    blockers:logs.filter(l=>l.hasBlocker&&!l.blockerResolved),
    behind:milestones.filter(m=>m.status==='Behind Schedule'),overdue,
    reviewMs:milestones.filter(m=>m.status==='Needs Review'),
    reviewExps:experiments.filter(e=>e.status==='Needs Review'),
    reviewPubs:publications.filter(p=>p.status==='Supervisor Review'||p.status==='Revision'),
    published:publications.filter(p=>p.status==='Published'||p.status==='Accepted').length,
    phase:active?active.phase:phasesFor(student?.track)[0],
    lastLog:logs[0]||null};
}
function alerts(){
  const out=[];
  D().students.forEach(s=>{
    const b=bundle(s.id),push=(sev,tab,title,detail)=>out.push({sev,sid:s.id,name:s.name,track:s.track,tab,title,detail});
    b.blockers.forEach(l=>push('high','logs',`Active blocker (${fmt(l.date)})`,l.blockers||'Blocker flagged'));
    b.behind.forEach(m=>push('high','roadmap',`Behind schedule: ${m.title}`,`${m.phase} · due ${fmt(m.endDate)} · ${m.progress||0}%`));
    b.overdue.filter(m=>m.status!=='Behind Schedule').forEach(m=>push('high','roadmap',`Past due date: ${m.title}`,`Was due ${fmt(m.endDate)} · ${m.progress||0}% · status still "${m.status}"`));
    b.reviewMs.forEach(m=>push('medium','roadmap',`Milestone needs review: ${m.title}`,`${m.phase} · ${m.progress||0}%`));
    b.reviewExps.forEach(e=>push('medium','experiments',`Experiment review: ${e.runId||''} ${e.title||''}`,e.metric||e.config||''));
    b.reviewPubs.forEach(p=>{const dd=daysUntil(p.deadline);push(dd!==null&&dd<=14&&dd>=0?'high':'medium','publications',`Manuscript (${p.status}): ${p.title}`,`${p.venue||'Venue TBD'}${p.deadline?' · deadline '+fmt(p.deadline)+(dd!==null&&dd>=0?` (${dd} days)`:''):''}`)});
    const lastDays=b.lastLog?-daysUntil(b.lastLog.date):null;
    const gap=s.cadence==='Weekly'?14:s.cadence==='Monthly'?45:21;
    if(b.lastLog&&lastDays>gap)push('medium','logs','No meeting log recently',`Last log ${fmt(b.lastLog.date)} (${lastDays} days ago, cadence ${s.cadence||'n/a'})`);
  });
  return out.sort((a,b)=>a.sev===b.sev?0:a.sev==='high'?-1:1);
}

function submitForm(form){
  const coll=form.dataset.coll,id=form.dataset.id,sid=form.dataset.sid,f=FORMS[coll];

    else if(type==='number')obj[k]=Math.max(0,Math.min(100,Number(fd.get(k))||0));
    else if(type==='lines')obj[k]=String(fd.get(k)||'').split('\n').map(s=>s.trim()).filter(Boolean).map(s=>({id:uid('np'),done:/^\[x\]/i.test(s),text:s.replace(/^\[x\]\s*/i,'')}));

  });
  if(coll==='students'&&isAdmin())obj.supervisorIds=[...form.elements].filter(e=>e.name&&e.name.startsWith('sup_')&&e.checked).map(e=>e.name.slice(4));

}

const up={files:[],text:'',parsed:null,target:'',category:'Progress Report',busy:false,savedNames:[]};
async function extractFile(file){
  const name=file.name.toLowerCase();
  if(name.endsWith('.docx')&&window.mammoth){const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return r.value}
  if(name.endsWith('.pdf')&&window.pdfjsLib){
    window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
    let out='';for(let i=1;i<=Math.min(pdf.numPages,40);i++){const c=await(await pdf.getPage(i)).getTextContent();out+=c.items.map(x=>x.str).join(' ')+'\n'}return out}
  if(/\.(xlsx|xls)$/.test(name)&&window.XLSX){const wb=window.XLSX.read(await file.arrayBuffer());return wb.SheetNames.map(n=>`# Sheet ${n}\n`+window.XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n')}
  if(/\.(txt|md|csv|json)$/.test(name))return await file.text();
  return '';
}

function showTempPassword(email,pw){
  openModal('Account ready',`<div class="space-y-3 text-sm"><p>Send these sign-in details to <b>${esc(email)}</b>. They will be asked to choose their own password on first sign-in.</p>
   <div class="rounded-xl border border-slate-200 bg-slate-50 p-3 font-mono text-sm"><div>Address: ${esc(location.origin)}</div><div>Email: ${esc(email)}</div><div>Temporary password: <b>${esc(pw)}</b></div></div>
   <p class="text-xs text-amber-800">This password is shown only once.</p>
   <div class="flex justify-end gap-2">${btn('copyCreds','Copy details','copy','bg-slate-900 text-white',`data-email="${esc(email)}" data-pw="${esc(pw)}"`)}${btn('closeModal','Done','')}</div></div>`);

function submitUser(form){
  const id=form.dataset.id,fd=new FormData(form);
  const r=form.elements.role.disabled?state.me.role:fd.get('role');
  const body={name:String(fd.get('name')||'').trim(),role:r,studentId:String(fd.get('studentId')||''),assignedStudents:[...form.elements].filter(e=>e.name&&e.name.startsWith('as_')&&e.checked).map(e=>e.name.slice(3))};
  if(!id)body.email=String(fd.get('email')||'').trim();
  if(r==='student'&&!body.studentId){toast('Choose which student record this account opens.','warning');return}
  closeModal();
  mutate(async()=>{
    if(id)await api('PUT','/api/users/'+id,body);
    else{const res=await api('POST','/api/users',body);setTimeout(()=>showTempPassword(res.user.email,res.tempPassword),50)}
    state.users=await api('GET','/api/users');
  },id?'Account saved':null);
}
function renderUsers(){
  if(!state.users){loadUsers();return '<p class="text-sm text-slate-500">Loading accounts…</p>'}

      <p class="text-sm text-slate-500">${esc(s.degree)}${s.coSupervisor?' · Co-supervisor: '+esc(s.coSupervisor):''}</p><p class="mt-2 max-w-3xl text-sm text-slate-700">${esc(s.topic)}</p></div>
     <div class="flex flex-wrap gap-2">${!state.aiEnabled?'':btn('aiStudent','Meeting prep','sparkles','border border-indigo-200 bg-indigo-50 text-indigo-700 hover:bg-indigo-100',`data-id="${id}"`)}${!isSup()?'':btn('editStudent','Edit profile','pencil','border border-slate-200 bg-white text-slate-700 hover:bg-slate-50',`data-id="${id}"`)}</div>
    </div>
    <div class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-4 text-sm">
     <div><div class="text-[11px] font-semibold text-slate-500">Overall progress</div><div class="font-extrabold text-lg">${b.avg}%</div>${bar(b.avg)}</div>
     <div><div class="text-[11px] font-semibold text-slate-500">Milestones done</div><div class="font-extrabold text-lg">${b.done}/${b.milestones.length}</div></div>
     <div><div class="text-[11px] font-semibold text-slate-500">Next meeting</div><div class="font-bold">${fmt(s.nextMeetingDate)}</div><div class="text-[11px] text-slate-500">${s.cadence||''}${nm!==null?` · ${nm<0?Math.abs(nm)+' days ago':nm===0?'today':'in '+nm+' days'}`:''}</div></div>
     <div><div class="text-[11px] font-semibold text-slate-500">Target graduation</div><div class="font-bold">${fmt(s.targetGraduation)}</div><div class="text-[11px] text-slate-500">${dg!==null?(dg<0?'passed':Math.round(dg/30.4)+' months left'):''}</div></div>
    </div>
    <div class="mt-4 flex gap-1">${ph.map(p=>{const m=b.milestones.filter(x=>x.phase===p);const done=m.length&&m.every(x=>x.status==='Completed');const cur=p===b.phase;return `<div class="flex-1 min-w-0"><div class="h-2 rounded-full ${done?'bg-emerald-500':cur?'bg-indigo-500':'bg-slate-200'}"></div><div class="mt-1 hidden truncate text-[10px] sm:block ${cur?'font-bold text-indigo-700':'text-slate-500'}" title="${esc(p)}">${esc(p)}</div></div>`}).join('')}</div>
    ${ai?`<div class="mt-4 rounded-xl border border-indigo-100 bg-indigo-50/40 p-3"><div class="mb-1 flex items-center justify-between"><span class="text-xs font-bold text-indigo-800">Meeting prep by Claude</span><span class="flex gap-1">${iconBtn('copyStuAI','copy',`data-id="${id}"`,'Copy')}${iconBtn('clearStuAI','x',`data-id="${id}"`,'Close')}</span></div><pre id="ai-stu-text" class="whitespace-pre-wrap font-sans text-sm text-slate-800">${esc(ai)}</pre></div>`:''}
   </div>

const addBtn=(coll,label,sid)=>!canEdit(coll)?'':btn('add','Add '+label,'plus','bg-indigo-600 text-white hover:bg-indigo-700',`data-coll="${coll}" data-sid="${sid}"`);
const empty=(t)=>`<div class="rounded-2xl border border-dashed border-slate-300 bg-white p-8 text-center text-sm text-slate-500">${t}</div>`;

  ${ph.map(p=>{const ms=b.milestones.filter(m=>m.phase===p);return `<section class="rounded-2xl border border-slate-200 bg-white"><div class="border-b border-slate-100 px-4 py-2.5 text-xs font-bold text-slate-600">${esc(p)}</div>
   ${ms.length?ms.map(m=>{const od=b.overdue.includes(m);return `<div class="flex flex-wrap items-center gap-3 px-4 py-3 border-b border-slate-50 last:border-0"><div class="min-w-0 flex-1 basis-60"><div class="text-sm font-semibold">${esc(m.title)}</div><div class="text-[11px] text-slate-500">${fmt(m.startDate)} → ${fmt(m.endDate)} ${m.deliverableUrl?'· '+link(m.deliverableUrl,'deliverable'):''}</div></div>

}
function tabLogs(b){
  return `<div class="space-y-3"><div class="flex justify-between items-center gap-2"><p class="text-sm text-slate-500">Students write what they did and what blocks them; you add feedback and agreed actions.</p>${addBtn('logs','meeting log',b.student.id)}</div>
  ${b.logs.length?b.logs.map(l=>`<article class="rounded-2xl border ${l.hasBlocker&&!l.blockerResolved?'border-rose-200':'border-slate-200'} bg-white p-4 space-y-3">
   <div class="flex items-start justify-between gap-2"><div><div class="font-bold">${fmt(l.date)}</div><div class="text-[11px] text-slate-500">by ${esc(l.author||'—')}</div></div><div class="flex items-center gap-1">${l.hasBlocker?(l.blockerResolved?badge('Completed'):badge('Behind Schedule')):''}${editBtn('logs',l.id)}</div></div>
   ${l.completed?`<div><div class="text-[11px] font-bold uppercase text-slate-500">Completed</div><p class="whitespace-pre-wrap text-sm text-slate-700">${esc(l.completed)}</p></div>`:''}
   ${l.hasBlocker?`<div class="rounded-xl ${l.blockerResolved?'bg-slate-50':'bg-rose-50'} p-3"><div class="flex items-center justify-between gap-2"><span class="text-[11px] font-bold uppercase ${l.blockerResolved?'text-slate-500':'text-rose-700'}">Blocker${l.blockerResolved?' (resolved)':''}</span>${canEdit('logs')?'':'<!--'}<button data-act="toggleBlocker" data-id="${l.id}" class="text-xs font-semibold text-indigo-700 hover:underline">${l.blockerResolved?'Reopen':'Mark resolved'}</button>${canEdit('logs')?'':'-->'}</div><p class="text-sm text-slate-800">${esc(l.blockers)}</p></div>`:''}
   ${(l.nextPlan||[]).length?`<div><div class="text-[11px] font-bold uppercase text-slate-500 mb-1">Next plan</div>${l.nextPlan.map(n=>`<label class="flex items-start gap-2 text-sm py-0.5"><input type="checkbox" data-plan="${l.id}:${n.id}" ${canEdit('logs')?'':'disabled'} ${n.done?'checked':''} class="mt-0.5 h-4 w-4 rounded text-indigo-600"/><span class="${n.done?'line-through text-slate-400':''}">${esc(n.text)}</span></label>`).join('')}</div>`:''}
   ${l.supervisorFeedback||l.agreedActionItems?`<div class="rounded-xl bg-indigo-50/50 border border-indigo-100 p-3 text-sm">${l.supervisorFeedback?`<div><span class="text-[11px] font-bold uppercase text-indigo-800">Supervisor feedback</span><p class="text-slate-800">${esc(l.supervisorFeedback)}</p></div>`:''}${l.agreedActionItems?`<div class="mt-2"><span class="text-[11px] font-bold uppercase text-indigo-800">Agreed actions</span><p class="text-slate-800">${esc(l.agreedActionItems)}</p></div>`:''}</div>`:(isSup()?`<button data-act="edit" data-coll="logs" data-id="${l.id}" class="text-xs font-semibold text-indigo-700 hover:underline">+ Add your feedback</button>`:'')}
   <div class="flex flex-wrap gap-3 text-xs">${link(l.codeUrl,'Code')}${link(l.writingUrl,'Writing')}</div></article>`).join(''):empty('No meeting logs yet. Add one after each supervision meeting.')}</div>`;
}
function tabExperiments(b){
  const t=(v,l)=>`<button data-act="setExpView" data-v="${v}" class="rounded-lg px-3 py-1.5 ${state.expView===v?'bg-white shadow-sm text-indigo-700':'text-slate-600'}">${l}</button>`;
  const card=e=>`<div draggable="${canEdit('experiments')}" data-drag="${e.id}" class="cursor-grab rounded-xl border border-slate-200 bg-white p-3 shadow-sm active:cursor-grabbing"><div class="flex items-start justify-between gap-1"><span class="font-mono text-[11px] font-bold text-slate-500">${esc(e.runId)}</span>${editBtn('experiments',e.id)}</div><div class="text-sm font-semibold">${esc(e.title)}</div><div class="mt-1 text-[11px] text-slate-500">${esc(e.config)}</div><div class="mt-2 text-xs font-semibold text-slate-800">${esc(e.metric)}</div><div class="mt-2 flex items-center justify-between">${badge(e.outcome)}<span class="text-[10px] text-slate-400">${e.date?fmt(e.date):''}</span></div></div>`;
  return `<div class="space-y-3"><div class="flex flex-wrap justify-between items-center gap-2"><div class="inline-flex rounded-xl bg-slate-100 p-1 text-xs font-semibold">${t('kanban','Board')}${t('table','Table')}</div>${addBtn('experiments','experiment',b.student.id)}</div>
  ${!b.experiments.length?empty('No experiments yet.'):state.expView==='kanban'?`${canEdit('experiments')?'<p class="text-[11px] text-slate-500">Drag cards between columns.</p>':''}<div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">${KANBAN.map(c=>{const es=b.experiments.filter(e=>(e.status||'Backlog')===c);return `<div data-drop="${c}" class="rounded-2xl border border-slate-200 bg-slate-100/60 p-2 min-h-[140px] space-y-2"><div class="flex justify-between px-1 text-xs font-bold text-slate-600"><span>${c}</span><span>${es.length}</span></div>${es.map(card).join('')}</div>`}).join('')}</div>`
  :`<div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white"><table class="w-full text-sm"><thead class="bg-slate-50 text-left text-[11px] uppercase text-slate-500"><tr><th class="p-3">Run</th><th class="p-3">Title</th><th class="p-3">Result</th><th class="p-3">Status</th><th class="p-3">Outcome</th><th class="p-3"></th></tr></thead><tbody>${b.experiments.map(e=>`<tr class="border-t border-slate-100"><td class="p-3 font-mono text-xs whitespace-nowrap">${esc(e.runId)}</td><td class="p-3"><div class="font-medium">${esc(e.title)}</div><div class="text-[11px] text-slate-500">${esc(e.config)}</div></td><td class="p-3 text-xs">${esc(e.metric)}</td><td class="p-3">${badge(e.status)}</td><td class="p-3">${badge(e.outcome)}</td><td class="p-3">${editBtn('experiments',e.id)}</td></tr>`).join('')}</tbody></table></div>`}</div>`;
}
function tabLiterature(b){
  const q=state.litSearch.toLowerCase();
  const list=b.literature.filter(p=>(state.litRel==='All'||p.relevance===state.litRel)&&(!q||[p.title,p.authorsYear,p.venue,p.method,p.dataset,p.limitations].join(' ').toLowerCase().includes(q)));
  return `<div class="space-y-3"><div class="flex flex-wrap items-center gap-2"><input id="lit-search" value="${esc(state.litSearch)}" placeholder="Search papers, methods, datasets…" class="flex-1 min-w-[200px] rounded-xl border border-slate-200 px-3 py-2"/><select id="lit-rel" class="rounded-xl border border-slate-200 px-3 py-2 text-sm">${['All',...RELEVANCE].map(r=>`<option ${r===state.litRel?'selected':''}>${r}</option>`).join('')}</select>${addBtn('literature','paper',b.student.id)}</div>
  <p class="text-[11px] text-slate-500">${b.literature.length} papers · ${b.literature.filter(p=>p.doi&&p.doiVerified).length} with checked DOI</p>
  ${list.length?`<div class="overflow-x-auto rounded-2xl border border-slate-200 bg-white"><table class="w-full text-sm"><thead class="bg-slate-50 text-left text-[11px] uppercase text-slate-500"><tr><th class="p-3">Paper</th><th class="p-3">Method / data</th><th class="p-3">Gap</th><th class="p-3">Relevance</th><th class="p-3"></th></tr></thead><tbody>${list.map(p=>{const d=cleanDoi(p.doi);return `<tr class="border-t border-slate-100 align-top"><td class="p-3 min-w-[220px]"><div class="font-medium">${esc(p.title)}</div><div class="text-[11px] text-slate-500">${esc(p.authorsYear)} · ${esc(p.venue)}</div>${d?`<div class="mt-1 text-[11px]">${link('https://doi.org/'+d,d)} ${p.doiVerified?'<span class="text-emerald-700">✓</span>':''}</div>`:p.doi?'<div class="text-[11px] text-rose-600">Invalid DOI</div>':''}</td><td class="p-3 text-xs min-w-[160px]">${esc(p.method)}<div class="text-slate-500">${esc(p.dataset)}</div></td><td class="p-3 text-xs min-w-[160px]">${esc(p.limitations)}</td><td class="p-3">${badge(p.relevance==='High'?'In Progress':p.relevance==='Medium'?'Pending':'')}<span class="sr-only">${esc(p.relevance)}</span><div class="text-[11px] mt-1">${esc(p.relevance)}</div></td><td class="p-3">${editBtn('literature',p.id)}</td></tr>`}).join('')}</tbody></table></div>`:empty(b.literature.length?'No papers match.':'No papers yet. Build the literature matrix here.')}</div>`;
}
function tabPublications(b){
  return `<div class="space-y-3"><div class="flex justify-between items-center"><p class="text-sm text-slate-500">From idea to published.</p>${addBtn('publications','publication',b.student.id)}</div>
  ${b.publications.length?b.publications.map(p=>{const i=PUB_STATUS.indexOf(p.status),dd=daysUntil(p.deadline);return `<div class="rounded-2xl border border-slate-200 bg-white p-4"><div class="flex items-start justify-between gap-2"><div class="min-w-0"><div class="font-semibold">${esc(p.title)}</div><div class="text-xs text-slate-500">${esc(p.venue)}${p.tier?' · '+esc(p.tier):''} · ${esc(p.authors)}</div></div><div class="flex items-center gap-1">${badge(p.status)}${editBtn('publications',p.id)}</div></div>
   <div class="mt-3 flex gap-1">${PUB_STATUS.map((s,j)=>`<span title="${s}" class="h-1.5 flex-1 rounded-full ${j<=i?'bg-indigo-500':'bg-slate-200'}"></span>`).join('')}</div>
   <div class="mt-2 flex flex-wrap gap-3 text-[11px] text-slate-500">${p.deadline?`<span class="${dd!==null&&dd>=0&&dd<=14?'font-bold text-rose-600':''}">Deadline ${fmt(p.deadline)}${dd!==null&&dd>=0?` (${dd} days)`:''}</span>`:''}${link(p.draftUrl,'Draft')}${cleanDoi(p.doi)?link('https://doi.org/'+cleanDoi(p.doi),'DOI'):''}</div>
   <div class="mt-2"><select data-pubstatus="${p.id}" ${canEdit('publications')?'':'disabled'} class="rounded-lg border border-slate-200 px-2 py-1 text-xs">${PUB_STATUS.map(x=>`<option ${x===p.status?'selected':''}>${x}</option>`).join('')}</select></div></div>`}).join(''):empty('No publications yet.')}</div>`;

function tabReviews(b){
  return `<div class="space-y-3"><div class="flex justify-between items-center"><p class="text-sm text-slate-500">Qualifying exams, candidacy, ethics approvals, annual reviews and committee meetings.</p>${addBtn('reviews','review',b.student.id)}</div>
  ${b.reviews.length?`<ol class="relative border-l-2 border-slate-200 ml-2 space-y-4">${b.reviews.map(r=>`<li class="ml-4"><span class="absolute -left-[7px] mt-1.5 h-3 w-3 rounded-full border-2 border-white ${['Passed','Approved'].includes(r.outcome)?'bg-emerald-500':r.outcome==='Failed'?'bg-rose-500':'bg-amber-400'}"></span><div class="rounded-2xl border border-slate-200 bg-white p-4"><div class="flex justify-between gap-2"><div><div class="font-semibold">${esc(r.type)}</div><div class="text-[11px] text-slate-500">${fmt(r.date)}</div></div><div class="flex items-center gap-1">${badge(r.outcome)}${editBtn('reviews',r.id)}</div></div>${r.notes?`<p class="mt-2 text-sm text-slate-700">${esc(r.notes)}</p>`:''}</div></li>`).join('')}</ol>`:empty('No reviews or exams recorded.')}</div>`;
}

  userDelete:d=>confirmBox('Delete this account? Their records and feedback stay.','userDeleteYes',`data-id="${d.id}"`),
  userDeleteYes:d=>{closeModal();mutate(async()=>{await api('DELETE','/api/users/'+d.id);state.users=await api('GET','/api/users')},'Account deleted')},
  copyCreds:d=>copyText(`ResearchHub sign-in\nAddress: ${location.origin}\nEmail: ${d.email}\nTemporary password: ${d.pw}`),
  openPassword:()=>passwordModal(false),
  logout:async()=>{try{await api('POST','/api/auth/logout')}catch{}state.me=null;state.data=emptyData();state.users=null;renderAll()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset)}});
document.getElementById('modal-shell').addEventListener('click',e=>{if(e.target.id==='modal-shell'&&!state.me?.mustChangePassword)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!state.me?.mustChangePassword)closeModal()});
document.addEventListener('submit',async e=>{
  const t=e.target;
  if(t.id==='entity-form'){e.preventDefault();submitForm(t)}
  else if(t.id==='user-form'){e.preventDefault();submitUser(t)}
  else if(t.id==='comment-form'){e.preventDefault();const text=t.elements.text.value.trim();if(text)mutate(()=>api('POST','/api/comments',{studentId:t.dataset.sid,text}),'Feedback posted')}
  else if(t.id==='login-form'){e.preventDefault();const fd=new FormData(t);try{const r=await api('POST','/api/auth/login',{email:fd.get('email'),password:fd.get('password')});await boot(r.user)}catch(err){toast(err.message,'error')}}
  else if(t.id==='pw-form'){e.preventDefault();const fd=new FormData(t);if(fd.get('newPassword')!==fd.get('newPassword2')){toast('The two new passwords do not match.','warning');return}
    try{await api('POST','/api/auth/change-password',{currentPassword:fd.get('currentPassword'),newPassword:fd.get('newPassword')});state.me.mustChangePassword=false;closeModal();toast('Password changed','success')}catch(err){toast(err.message,'error')}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.progress){const m=D().milestones.find(x=>x.id===t.dataset.progress);if(m){const p=Number(t.value);let st=m.status;if(p===100)st='Completed';else if(st==='Completed')st='In Progress';else if(st==='Not Started'&&p>0)st='In Progress';patch('milestones',m.id,{progress:p,status:st})}}
  else if(t.dataset.msstatus){patch('milestones',t.dataset.msstatus,t.value==='Completed'?{status:t.value,progress:100}:{status:t.value})}
  else if(t.dataset.pubstatus){patch('publications',t.dataset.pubstatus,{status:t.value})}
  else if(t.dataset.plan){const [lid,nid]=t.dataset.plan.split(':');const l=D().logs.find(x=>x.id===lid);if(l)patch('logs',lid,{nextPlan:(l.nextPlan||[]).map(n=>n.id===nid?{...n,done:t.checked}:n)})}
  else if(t.id==='lit-rel'){state.litRel=t.value;renderAll()}
  else if(t.id==='up-input'){setUpFiles([...t.files])}
  else if(t.id==='uf-role'){document.getElementById('uf-student').classList.toggle('hidden',t.value!=='student');document.getElementById('uf-assign').classList.toggle('hidden',!['reviewer','supervisor'].includes(t.value))}
});
document.addEventListener('input',e=>{if(e.target.dataset.progress){e.target.nextElementSibling.textContent=e.target.value+'%'}
  if(e.target.id==='lit-search'){state.litSearch=e.target.value;const pos=e.target.selectionStart;renderAll();const n=document.getElementById('lit-search');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]');if(c){state.dragId=c.dataset.drag;try{e.dataTransfer.setData('text/plain',c.dataset.drag)}catch{}}});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-drop],#up-drop');if(z){e.preventDefault();z.classList.add('drop-on')}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('[data-drop],#up-drop');if(z&&!z.contains(e.relatedTarget))z.classList.remove('drop-on')});
document.addEventListener('drop',e=>{
  const u=e.target.closest&&e.target.closest('#up-drop');if(u){e.preventDefault();u.classList.remove('drop-on');setUpFiles([...e.dataTransfer.files]);return}
  const z=e.target.closest&&e.target.closest('[data-drop]');if(!z)return;e.preventDefault();
  const ex=D().experiments.find(x=>x.id===state.dragId);state.dragId=null;
  if(ex&&ex.status!==z.dataset.drop&&canEdit('experiments')){ex.status=z.dataset.drop;renderAll();patch('experiments',ex.id,{status:z.dataset.drop})}else renderAll();
});

async function boot(user){
  state.booted=true;
  try{const r=await api('GET','/api/me');state.me=r.user;state.aiEnabled=r.aiEnabled;state.maxUploadMb=r.maxUploadMb||25}
  catch{state.me=null;renderAll();return}
  await reload();
  if(state.me.mustChangePassword)passwordModal(true);
}
boot();
}

</script>
</body>
</html>
